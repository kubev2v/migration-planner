---
name: PR Validations

on:  # yamllint disable-line rule:truthy
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [main, stable]
  merge_group:
    types: [checks_requested]

permissions:
  pull-requests: read
  contents: read

jobs:
  # Configuration job - define all shared values once.
  # Path filtering lives here (not on on.pull_request.paths) so this workflow
  # always runs and required checks are never left pending.
  config:
    name: Validation configuration
    runs-on: ubuntu-latest
    outputs:
      allowed-types: ${{ steps.set-config.outputs.allowed-types }}
      jira-pattern: ${{ steps.set-config.outputs.jira-pattern }}
      jira-required-types: ${{ steps.set-config.outputs.jira-required-types }}
      bot-authors: ${{ steps.set-config.outputs.bot-authors }}
      run-code-validations: ${{ steps.filter.outputs.code }}
    steps:
      - id: set-config
        run: |
          echo 'allowed-types=["feat","fix","ci","build","chore","docs","refactor","test","style","perf","revert"]' >> $GITHUB_OUTPUT
          echo 'jira-pattern=(ECOPROJECT|OMA)-[0-9]+' >> $GITHUB_OUTPUT
          echo 'jira-required-types=["feat","fix"]' >> $GITHUB_OUTPUT
          echo 'bot-authors=["red-hat-konflux[bot]","dependabot[bot]","migration-planner-sync[bot]"]' >> $GITHUB_OUTPUT

      - name: Check out path filters
        uses: actions/checkout@v4

      - name: Detect whether code validations are needed
        id: filter
        uses: dorny/paths-filter@v3
        with:
          # Compare the entire queue candidate with its recorded base, not just
          # the last PR or the current (potentially newer) target branch.
          base: ${{ github.event.merge_group.base_sha || '' }}
          ref: ${{ github.event.merge_group.head_sha || '' }}
          filters: .github/path-filters.yml
          predicate-quantifier: 'every'

  # Validate commit messages
  validate-commits:
    needs: config
    uses: kubev2v/migration-planner-workflows/.github/workflows/validate-commit-messages.yml@main
    with:
      types: ${{ needs.config.outputs.allowed-types }}
      jira-pattern: ${{ needs.config.outputs.jira-pattern }}
      jira-required-types: ${{ needs.config.outputs.jira-required-types }}
      skip-authors: ${{ needs.config.outputs.bot-authors }}

  # Validate PR title and description
  validate-pr-title:
    needs: config
    uses: kubev2v/migration-planner-workflows/.github/workflows/validate-pr-title-description.yml@main
    with:
      allowed-types: ${{ needs.config.outputs.allowed-types }}
      jira-pattern: ${{ needs.config.outputs.jira-pattern }}
      jira-required-types: ${{ needs.config.outputs.jira-required-types }}
      skip-authors: ${{ needs.config.outputs.bot-authors }}

  lint:
    runs-on: ubuntu-latest
    needs: config
    if: github.event_name != 'merge_group' && needs.config.outputs.run-code-validations == 'true'
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      # Node required for setup-go post (cache save); needed when running with act
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Setup libvirt
        run: |
          sudo apt update
          sudo apt install -y libvirt-dev

      - name: Run golangci-lint
        run: make lint

  check-generate:
    runs-on: ubuntu-latest
    needs: config
    if: needs.config.outputs.run-code-validations == 'true'
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Check generated files are up to date
        run: |
          make check-generate
          # The Makefile only checks for uncommitted changes, allowing users to keep untracked files in the repository.
          # Here, we also check for untracked files, as none are expected at this stage.
          if [[ $(git ls-files --others --exclude-standard) ]]; then git ls-files --others --exclude-standard; echo "These files are not tracked by git"; exit 1; fi

  check-appliance-version:
    runs-on: ubuntu-latest
    needs: config
    if: needs.config.outputs.run-code-validations == 'true'
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      # APPLIANCE_VERSION is used both to pull the appliance image and to report
      # the version the service serves, so the tag and its label must agree.
      - name: Check the appliance tag matches the image version label
        run: |
          source build/migration-planner-iso/config
          LABEL=$(skopeo inspect --format '{{index .Labels "org.opencontainers.image.version"}}' \
            "docker://${APPLIANCE_IMAGE}:${APPLIANCE_VERSION}")
          [[ "$LABEL" == "$APPLIANCE_VERSION" ]] || {
            echo "::error::appliance tag ${APPLIANCE_VERSION} does not match its version label ${LABEL}"
            exit 1
          }

      # MIN_APPLIANCE_VERSION gates in-place updates; it must mirror the served
      # image's min-upgrade-version label and be a valid version (or empty).
      - name: Check the min appliance version matches the image label
        run: |
          source build/migration-planner-iso/config
          source hack/appliance-version-regex.sh
          MIN_LABEL=$(skopeo inspect --format '{{index .Labels "io.kubev2v.oma.min-upgrade-version"}}' \
            "docker://${APPLIANCE_IMAGE}:${APPLIANCE_VERSION}")
          [[ "$MIN_LABEL" == "${MIN_APPLIANCE_VERSION:-}" ]] || {
            echo "::error::MIN_APPLIANCE_VERSION=${MIN_APPLIANCE_VERSION:-} does not match the image min-upgrade-version label ${MIN_LABEL}"
            exit 1
          }
          [[ -z "${MIN_APPLIANCE_VERSION:-}" || "${MIN_APPLIANCE_VERSION}" =~ $APPLIANCE_VERSION_RE ]] || {
            echo "::error::MIN_APPLIANCE_VERSION=${MIN_APPLIANCE_VERSION} is not a valid appliance version"
            exit 1
          }

  check-format:
    runs-on: ubuntu-latest
    needs: config
    if: github.event_name != 'merge_group' && needs.config.outputs.run-code-validations == 'true'
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Check that formatting does not introduce changes
        run: make check-format

  unit-test:
    runs-on: ubuntu-latest
    needs: config
    if: needs.config.outputs.run-code-validations == 'true'
    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: 'go.mod'

    - name: Setup libvirt
      run: |
        sudo apt update
        sudo apt install -y libvirt-dev

    - name: Setup Podman
      run: |
        sudo apt update
        sudo apt install -y podman podman-compose

    - name: Run the tests
      run: make unit-test

  tidy-check:
    name: Go Mod Tidy Check
    runs-on: ubuntu-latest
    needs: config
    if: needs.config.outputs.run-code-validations == 'true'
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Check Go modules are tidy
        run: make tidy-check

  verify-build:
    name: Verify Build
    runs-on: ubuntu-latest
    needs: config
    if: needs.config.outputs.run-code-validations == 'true'
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Setup libvirt
        run: |
          sudo apt update
          sudo apt install -y libvirt-dev

      - name: Build binaries
        run: make build

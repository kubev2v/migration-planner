name: PR Welcome

on:
  pull_request_target:
    types: [opened, ready_for_review]
  issue_comment:
    types: [edited]

jobs:
  welcome:
    uses: kubev2v/migration-planner-workflows/.github/workflows/pr-welcome.yml@8faa41115a8ee0144097ab6015f7277675faf1a4 # main
    with:
      skip-authors: '["red-hat-konflux[bot]","dependabot[bot]","migration-planner-sync[bot]"]'
    permissions:
      pull-requests: write
      issues: write

name: PR Welcome

on:
  pull_request_target:
    types: [opened, ready_for_review]
  issue_comment:
    types: [edited]

jobs:
  welcome:
    uses: kubev2v/migration-planner-workflows/.github/workflows/pr-welcome.yml@b91113e8d6564d7997350b279129e43bbc1f3a19 # main
    with:
      skip-authors: '["red-hat-konflux[bot]","dependabot[bot]","migration-planner-sync[bot]"]'
    permissions:
      pull-requests: write
      issues: write

name: Run e2e test

on:
  workflow_dispatch:
  push:
    branches: [main, stable]
  pull_request:
    branches: [main, stable]

permissions:
  contents: read
  pull-requests: read

jobs:
  # Path filtering lives here (not on on.pull_request.paths) so this workflow
  # always runs and required checks are never left pending.
  # Branch protection should require the "Required e2e" job.
  # Skip list is shared with pull-request.yml via .github/path-filters.yml.
  changes:
    runs-on: ubuntu-latest
    outputs:
      run-e2e: ${{ steps.set.outputs.run-e2e }}
    steps:
      - name: Check out path filters
        if: github.event_name != 'workflow_dispatch'
        uses: actions/checkout@v4

      - name: Detect whether e2e is needed
        if: github.event_name != 'workflow_dispatch'
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: .github/path-filters.yml
          predicate-quantifier: 'every'

      - name: Set run-e2e
        id: set
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "run-e2e=true" >> "$GITHUB_OUTPUT"
          else
            echo "run-e2e=${{ steps.filter.outputs.code }}" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: changes
    if: needs.changes.outputs.run-e2e == 'true'
    runs-on: ubuntu-latest
    env:
      KUBECONFIG: ${{ runner.temp }}/e2e-kubeconfig

    steps:
      - name: Checkout the code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y qemu-utils sshpass libvirt-dev \
            libvirt-daemon libvirt-daemon-system
          sudo systemctl restart libvirtd

      - name: Generate private key for planner local auth method
        run: |
          sudo mkdir -p /etc/planner/e2e
          sudo chown -R $(whoami):$(whoami) /etc/planner/e2e
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 \
            -out /etc/planner/e2e/private-key
          openssl rsa -in /etc/planner/e2e/private-key \
            -out /etc/planner/e2e/private-key -traditional
          echo "E2E_PRIVATE_KEY_FOLDER_PATH=/etc/planner/e2e" >> $GITHUB_ENV

      - name: Build e2e binary
        run: make build-e2e

      - name: Determine image tag
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            TAG="on-pr-${{ github.event.pull_request.head.sha }}"
          else
            TAG="${{ github.sha }}"
          fi
          echo "IMAGE_TAG=${TAG}" >> $GITHUB_ENV

          REGISTRY="quay.io/redhat-user-workloads/assisted-migration-tenant"
          echo "E2E_API_IMAGE=${REGISTRY}/migration-planner-api:${TAG}" >> $GITHUB_ENV
          echo "E2E_ISO_IMAGE=${REGISTRY}/migration-planner-rhcos-iso:${TAG}" >> $GITHUB_ENV    

      - name: Wait for Konflux images
        timeout-minutes: 60
        run: |
          for image in "$E2E_API_IMAGE" "$E2E_ISO_IMAGE"; do
            echo "Waiting for ${image}..."
            until skopeo inspect --no-tags "docker://${image}" > /dev/null 2>&1; do
              echo "  Not ready yet, retrying in 30s..."
              sleep 30
            done
            echo "  Found: ${image}"
          done

      - name: Run e2e tests
        run: |
          sudo -E ./bin/e2e \
            --api-image="${E2E_API_IMAGE}" \
            --iso-image="${E2E_ISO_IMAGE}" \
            --keep-env \
            --deployment-ready-timeout=10m

      - name: Collect logs
        if: always()
        timeout-minutes: 5
        run: |
          KUBECTL=(sudo -E kubectl --context=kind-kind-e2e --namespace=default --request-timeout=20s)
          "${KUBECTL[@]}" get deploy -o yaml || true
          "${KUBECTL[@]}" get pods -o wide || true
          "${KUBECTL[@]}" get events --sort-by=.metadata.creationTimestamp || true
          for pod in $("${KUBECTL[@]}" get pods -o name || true); do
            echo "=== Logs for ${pod} ==="
            "${KUBECTL[@]}" logs "${pod}" --all-containers --timestamps --prefix --tail=500 || true
            echo "=== Previous logs for ${pod} ==="
            "${KUBECTL[@]}" logs "${pod}" --all-containers --previous --timestamps --prefix --tail=500 || true
            echo "=== Describe ${pod} ==="
            "${KUBECTL[@]}" describe "${pod}" || true
            echo "======================="
          done

      - name: Delete e2e cluster
        if: always()
        run: sudo -E kind delete cluster --name kind-e2e

  # Always runs so branch protection can require this check on docs-only PRs.
  required:
    name: Required e2e
    needs: [changes, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify e2e job
        env:
          RUN_E2E: ${{ needs.changes.outputs.run-e2e }}
          CHANGES: ${{ needs.changes.result }}
          TEST: ${{ needs.test.result }}
        run: |
          echo "changes=$CHANGES run_e2e=$RUN_E2E test=$TEST"

          fail() { echo "::error::$1"; exit 1; }

          [[ "$CHANGES" == success ]] || fail "changes did not succeed ($CHANGES)"

          if [[ "$RUN_E2E" == true ]]; then
            [[ "$TEST" == success ]] || fail "e2e did not succeed ($TEST)"
          else
            echo "Only skippable files changed; e2e was skipped"
          fi

---
name: Generate API Client

on:  # yamllint disable-line rule:truthy
  push:
    branches: [main, stable]
    paths:
      - 'api/v1alpha1/openapi.yaml'
    tags:
      - '*'

# Required for npm Trusted Publishing (OIDC)
permissions:
  id-token: write
  contents: read

jobs:
  version:
    name: Determine version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        uses: kubev2v/migration-planner-workflows/.github/actions/determine-version@b91113e8d6564d7997350b279129e43bbc1f3a19 # main

  generate-client:
    name: Generate and publish API client
    needs: version
    uses: kubev2v/migration-planner-workflows/.github/workflows/generate-and-publish.yml@b91113e8d6564d7997350b279129e43bbc1f3a19 # main
    with:
      openapi-spec-url: "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/api/v1alpha1/openapi.yaml"
      package-name: "@openshift-migration-advisor/planner-sdk"
      package-version: ${{ needs.version.outputs.version }}
    secrets: inherit
